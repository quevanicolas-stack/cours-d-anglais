# Lit le journal des emails de l'espace membres, sans aucune adresse email
# (le dépôt et ses journaux sont publics). Lancement à la demande.
name: Diagnostic espace membres

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derniers envois et état des comptes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a23a6b25645269aa18a75ed494f88d4d
        shell: bash
        run: |
          set -o pipefail
          requete() {
            npx --yes wrangler@4 d1 execute fluentandforward-membres --remote --json --command "$1" 2>&1 \
              | tail -n 40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'
          }
          echo "::notice title=envois::$(requete "SELECT date, sujet, ok, erreur FROM envois ORDER BY id DESC LIMIT 6")"
          echo "::notice title=comptes::$(requete "SELECT statut, dernier_lien, date_expiration FROM membres ORDER BY id DESC LIMIT 6")"
      - name: Ce que servent les domaines
        shell: bash
        run: |
          rapport=""
          for hote in www.fluentandforward.com fluentandforward.com fluentandforward.pages.dev; do
            session=$(curl -s -m 15 -o /tmp/corps -w "%{http_code}" "https://$hote/api/membres/session"; echo " $(head -c 120 /tmp/corps)")
            script=$(curl -s -m 15 "https://$hote/membres/assets/membres.js?v=8" | grep -o -m1 -E '/api/membres/|script.google.com' || echo "introuvable")
            connexion=$(curl -s -m 15 -o /dev/null -w "%{http_code} -> %{redirect_url}" "https://$hote/membres/connexion.html")
            rapport="${rapport}${hote}%0A  /api/membres/session : ${session}%0A  membres.js appelle : ${script}%0A  connexion.html : ${connexion}%0A"
          done
          echo "::notice title=domaines::${rapport}"
