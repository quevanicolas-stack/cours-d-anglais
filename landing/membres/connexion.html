<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Espace membres | Fluent &amp; Forward</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/polices/polices.css">
<link rel="stylesheet" href="assets/membres.css">
</head>
<body>

<header class="entete">
  <div class="barre">
    <a class="marque" href="../index.html">Fluent &amp; Forward</a>
    <a href="inscription.html" style="font-size:.9rem">Demander un accès</a>
  </div>
</header>

<main class="cadre">
  <div class="contenu">
    <div class="carte">
      <span class="oeil">Espace membres</span>
      <h1>Connexion</h1>
      <p class="chapeau">
        Pas de mot de passe à retenir : indique ton adresse email, et un
        code à usage unique t'est envoyé pour te connecter.
      </p>

      <div id="etape-email" style="margin-top:28px">
        <form id="formulaire-email" novalidate>
          <div class="champ">
            <label for="email-connexion">Ton adresse email</label>
            <input type="email" id="email-connexion" name="email" autocomplete="email"
                   placeholder="Ton adresse email" required aria-describedby="erreur-email-connexion">
            <span class="erreur-champ" id="erreur-email-connexion">Cette adresse email semble incomplète.</span>
          </div>
          <button type="submit" class="bouton bouton-vert">Recevoir mon code</button>
          <p class="retour" role="status"></p>
        </form>
      </div>

      <div id="etape-code" hidden style="margin-top:28px">
        <p class="chapeau">Code envoyé à <strong id="email-affiche"></strong>.</p>
        <form id="formulaire-code" novalidate style="margin-top:18px">
          <div class="champ champ-code">
            <label for="code">Code à 6 chiffres</label>
            <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" placeholder="······" autocomplete="one-time-code" required>
          </div>
          <button type="submit" class="bouton bouton-vert">Me connecter</button>
          <p class="retour" role="status"></p>
        </form>
        <p class="lien-discret"><a href="#" id="renvoyer-code">Renvoyer un code</a></p>
      </div>

      <p class="lien-discret">Pas encore de compte ? <a href="inscription.html">Demander un accès</a></p>
    </div>
  </div>
</main>

<script src="assets/membres.js"></script>
</body>
</html>
